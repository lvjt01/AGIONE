<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGIONE · 我的收益</title>
<style>
/* ============================================
   CSS VARIABLES & RESET
   ============================================ */
:root {
  --primary:        #6C5CE7;
  --primary-light:  #A29BFE;
  --primary-dark:   #5A4BD1;
  --primary-bg:     rgba(108,92,231,0.06);
  --primary-border: rgba(108,92,231,0.18);

  --accent-green:   #00D2A0;
  --accent-orange:  #FDCB6E;
  --accent-red:     #FF6B6B;
  --accent-blue:    #74B9FF;

  --bg-body:        #F0F2F8;
  --bg-card:        #FFFFFF;
  --bg-hover:       #F8F9FC;
  --bg-input:       #F5F6FA;

  --text-primary:   #1A1D2E;
  --text-secondary: #6B7280;
  --text-muted:     #9CA3AF;

  --border:         #E5E7EB;
  --border-light:   #F0F1F5;

  --radius-sm:      6px;
  --radius-md:      10px;
  --radius-lg:      14px;
  --radius-xl:      18px;

  --shadow-sm:      0 1px 3px rgba(0,0,0,0.04);
  --shadow-md:      0 4px 14px rgba(0,0,0,0.06);
  --shadow-lg:      0 10px 30px rgba(0,0,0,0.08);
  --shadow-card:    0 2px 12px rgba(108,92,231,0.06);
  --shadow-drawer:  -8px 0 40px rgba(0,0,0,0.12);

  --font-family:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --transition:     0.25s cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-family);
  background: var(--bg-body);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ============================================
   SCROLLBAR
   ============================================ */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#D1D5DB; border-radius:10px; }
::-webkit-scrollbar-thumb:hover { background:#9CA3AF; }

/* ============================================
   LAYOUT
   ============================================ */
.page-wrapper {
  max-width: 1480px;
  margin: 0 auto;
  padding: 28px 32px 40px;
}

/* ============================================
   HEADER
   ============================================ */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}
.page-header .logo-area {
  display: flex;
  align-items: center;
  gap: 14px;
}
.page-header .logo-icon {
  width: 42px;
  height: 42px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: -0.5px;
  box-shadow: 0 4px 14px rgba(108,92,231,0.3);
}
.page-header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}
.page-header h1 span {
  color: var(--text-muted);
  font-weight: 400;
  font-size: 14px;
  margin-left: 10px;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.header-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--primary-bg);
  border: 1px solid var(--primary-border);
  border-radius: 20px;
  font-size: 12px;
  color: var(--primary);
  font-weight: 600;
}
.header-badge .dot {
  width: 7px; height: 7px;
  background: var(--accent-green);
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity:1; }
  50% { opacity:0.4; }
}

/* ============================================
   SECTION 1 — DIMENSION SELECTOR (two groups)
   ============================================ */
.dimension-bar {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: var(--shadow-card);
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.dim-group {
  display: flex;
  align-items: center;
  gap: 0;
}
.dim-group-label {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-primary);
  margin-right: 10px;
  white-space: nowrap;
  flex-shrink: 0;
}
.dim-group-btns {
  display: flex;
  gap: 0;
}
.dim-btn {
  padding: 7px 20px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  background: #fff;
  border: 1.5px solid var(--border);
  cursor: pointer;
  transition: var(--transition);
  user-select: none;
  white-space: nowrap;
  letter-spacing: 0.2px;
  font-family: var(--font-family);
  outline: none;
}
.dim-btn:first-child {
  border-radius: 6px 0 0 6px;
}
.dim-btn:last-child {
  border-radius: 0 6px 6px 0;
}
.dim-btn:not(:first-child) {
  margin-left: -1.5px;
}
.dim-btn:hover {
  color: var(--primary);
  border-color: var(--primary-border);
  z-index: 1;
}
.dim-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  z-index: 2;
  box-shadow: 0 2px 8px rgba(108,92,231,0.25);
}
.dim-sep {
  width: 1px;
  height: 28px;
  background: var(--border);
  margin: 0 16px;
  flex-shrink: 0;
}

/* ============================================
   SECTION 2 — SETTLEMENT OVERVIEW CARDS
   ============================================ */
.overview-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 24px;
}
.overview-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
  transition: var(--transition);
  border: 1px solid transparent;
}
.overview-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--primary-border);
}
.overview-card .card-deco {
  position: absolute;
  top: -20px;
  right: -20px;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  opacity: 0.08;
}
.overview-card:nth-child(1) .card-deco { background: var(--primary); }
.overview-card:nth-child(2) .card-deco { background: var(--accent-green); }
.overview-card:nth-child(3) .card-deco { background: var(--accent-blue); }
.overview-card:nth-child(4) .card-deco { background: var(--accent-orange); }

.overview-card .card-label {
  font-size: 12.5px;
  color: var(--text-muted);
  font-weight: 500;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.overview-card .card-label .label-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}
.overview-card:nth-child(1) .label-dot { background: var(--primary); }
.overview-card:nth-child(2) .label-dot { background: var(--accent-green); }
.overview-card:nth-child(3) .label-dot { background: var(--accent-blue); }
.overview-card:nth-child(4) .label-dot { background: var(--accent-orange); }

.overview-card .card-value {
  font-size: 28px;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -1px;
  line-height: 1.2;
}
.overview-card .card-unit {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  margin-left: 4px;
}
.overview-card .card-change {
  margin-top: 8px;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 20px;
}
.card-change.up { color: #10B981; background: rgba(16,185,129,0.1); }
.card-change.down { color: var(--accent-red); background: rgba(255,107,107,0.1); }

/* ============================================
   SECTION 3 — FILTER BAR
   ============================================ */
.filter-section {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  box-shadow: var(--shadow-card);
  margin-bottom: 24px;
}
.filter-section .filter-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px 18px;
}
.filter-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.filter-item label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}
.filter-item input,
.filter-item select {
  height: 38px;
  padding: 0 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-input);
  transition: var(--transition);
  font-family: var(--font-family);
  outline: none;
  width: 100%;
}
.filter-item input:focus,
.filter-item select:focus {
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(108,92,231,0.1);
}
.filter-item input::placeholder { color: var(--text-muted); }
.filter-item .date-range {
  display: flex;
  align-items: center;
  gap: 8px;
}
.filter-item .date-range span {
  color: var(--text-muted);
  font-size: 12px;
  flex-shrink: 0;
}
.filter-actions {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--border-light);
}
.btn {
  height: 38px;
  padding: 0 24px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  border: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--font-family);
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 4px 12px rgba(108,92,231,0.25);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(108,92,231,0.35);
}
.btn-secondary {
  background: var(--bg-input);
  color: var(--text-secondary);
  border: 1.5px solid var(--border);
}
.btn-secondary:hover {
  background: #fff;
  border-color: var(--primary-border);
  color: var(--primary);
}

/* ============================================
   SECTION 4 — DATA TABLE
   ============================================ */
.table-section {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  border-bottom: 1px solid var(--border-light);
}
.table-header .table-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.table-header .record-count {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  background: var(--bg-input);
  padding: 3px 10px;
  border-radius: 20px;
}
.table-actions {
  display: flex;
  gap: 8px;
}
.btn-icon {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 14px;
  transition: var(--transition);
}
.btn-icon:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-bg);
}

.table-scroll {
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1400px;
}
thead th {
  padding: 12px 16px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  text-align: left;
  background: var(--bg-input);
  border-bottom: 1px solid var(--border-light);
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  user-select: none;
  cursor: pointer;
  position: relative;
}
thead th:hover { color: var(--primary); }
thead th .sort-icon {
  display: inline-block;
  margin-left: 4px;
  opacity: 0.3;
  font-size: 10px;
}
thead th:hover .sort-icon { opacity: 0.7; }

tbody td {
  padding: 14px 16px;
  font-size: 13px;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border-light);
  white-space: nowrap;
}
tbody tr { transition: var(--transition); }
tbody tr:hover { background: var(--primary-bg); }
tbody tr:last-child td { border-bottom: none; }

/* Cell badges & tags */
.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 600;
}
.tag-purple { background: rgba(108,92,231,0.1); color: var(--primary); }
.tag-green  { background: rgba(0,210,160,0.1); color: #00B894; }
.tag-blue   { background: rgba(116,185,255,0.1); color: #0984E3; }
.tag-orange { background: rgba(253,203,110,0.1); color: #E17055; }
.tag-gray   { background: var(--bg-input); color: var(--text-secondary); }

.cell-mono {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12.5px;
  font-weight: 600;
}
.cell-highlight {
  color: var(--primary);
  font-weight: 700;
}

.btn-detail {
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  background: var(--primary-bg);
  border: 1px solid var(--primary-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
}
.btn-detail:hover {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 3px 10px rgba(108,92,231,0.3);
}

/* ============================================
   PAGINATION
   ============================================ */
.pagination-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  border-top: 1px solid var(--border-light);
}
.pagination-info {
  font-size: 12.5px;
  color: var(--text-muted);
}
.pagination-info strong {
  color: var(--text-primary);
  font-weight: 700;
}
.pagination {
  display: flex;
  gap: 4px;
}
.page-btn {
  min-width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: #fff;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  padding: 0 6px;
}
.page-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.page-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 3px 10px rgba(108,92,231,0.25);
}
.page-btn.disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

/* ============================================
   DRAWER (RIGHT SIDE) — wider for table
   ============================================ */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,17,30,0.45);
  backdrop-filter: blur(4px);
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}
.drawer-overlay.open {
  opacity: 1;
  visibility: visible;
}
.drawer-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 780px;
  max-width: 94vw;
  height: 100vh;
  background: var(--bg-card);
  z-index: 1001;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-drawer);
}
.drawer-panel.open {
  transform: translateX(0);
}
.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 28px 20px;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}
.drawer-head h3 {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.drawer-head h3 .drawer-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 20px;
  background: var(--primary-bg);
  color: var(--primary);
}
.drawer-close {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--text-secondary);
  transition: var(--transition);
}
.drawer-close:hover {
  background: rgba(255,107,107,0.1);
  border-color: var(--accent-red);
  color: var(--accent-red);
}
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}

/* ---- Drawer: user summary card ---- */
.drawer-summary {
  padding: 24px 28px;
  background: linear-gradient(135deg, rgba(108,92,231,0.04), rgba(162,155,254,0.04));
  border-bottom: 1px solid var(--border-light);
}
.summary-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.summary-item {
  text-align: center;
}
.summary-item .s-label {
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 500;
  margin-bottom: 4px;
}
.summary-item .s-value {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.5px;
}
.summary-item .s-value.s-primary {
  color: var(--primary);
}
.summary-item .s-unit {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}

/* ---- Drawer: detail table (call records) ---- */
.drawer-table-wrap {
  padding: 0;
}
.drawer-table-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border-light);
}
.drawer-table-head .dt-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.drawer-table-head .dt-title::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--primary);
  border-radius: 2px;
}
.drawer-table-head .dt-count {
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 500;
  background: var(--bg-input);
  padding: 2px 10px;
  border-radius: 20px;
}

.drawer-table-scroll {
  overflow-x: auto;
}
.drawer-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}
.drawer-table thead th {
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-align: left;
  background: var(--bg-input);
  border-bottom: 1px solid var(--border-light);
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.drawer-table tbody td {
  padding: 11px 14px;
  font-size: 12.5px;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border-light);
  white-space: nowrap;
}
.drawer-table tbody tr { transition: var(--transition); }
.drawer-table tbody tr:hover { background: var(--primary-bg); }
.drawer-table tbody tr:last-child td { border-bottom: none; }

/* Row index column */
.row-idx {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  background: var(--bg-input);
  border-radius: 50%;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
}

.drawer-footer {
  padding: 18px 28px;
  border-top: 1px solid var(--border-light);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-shrink: 0;
}

/* ============================================
   DETAIL GRID (for time-dimension drawer fallback)
   ============================================ */
.detail-section { margin-bottom: 24px; }
.detail-section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-section-title::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--primary);
  border-radius: 2px;
}
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  background: var(--border-light);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.detail-cell {
  background: #fff;

<script>
/* ============================================
   DATA CONSTANTS
   ============================================ */
const modelNames   = ['GPT-4o','Claude-3.5-Sonnet','Gemini-1.5-Pro','DALL-E 3','Whisper-V3','GLM-4','Qwen-Max','DeepSeek-V3'];
const modelTypes   = ['大语言模型','图像生成模型','语音识别模型','多模态模型'];
const appNames     = ['AI 智能客服','文档助手','代码生成器','图像创作台','数据分析平台','智能翻译','营销文案助手','知识库问答'];
const userNames    = ['张伟','李娜','王磊','赵敏','刘洋','陈晨','杨帆','周明','吴佳','郑鑫','黄俊','林芳','钱程','孙颖','马超'];

// State
let dimAxis     = 'user';   // 'time' | 'user'
let dimContent  = 'model';  // 'model' | 'app'
let currentDim  = 'user-model';
let currentPage = 1;
const pageSize  = 10;

/* ============================================
   MOCK: generate raw call records (flat)
   ============================================ */
function rand(a){ return a[Math.floor(Math.random()*a.length)]; }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randDate(){
  const d=randInt(1,18), h=String(randInt(0,23)).padStart(2,'0'), m=String(randInt(0,59)).padStart(2,'0');
  return `2026-03-${String(d).padStart(2,'0')} ${h}:${m}`;
}

let rawRecords = [];
for(let i=0;i<320;i++){
  const inp=randInt(120,32000), out=randInt(80,16000), ded_inp=randInt(0,Math.min(inp,5000)), ded_out=randInt(0,Math.min(out,2000));
  const actual_inp=inp-ded_inp, actual_out=out-ded_out;
  const inpRate=randInt(50,200), outRate=randInt(10,50);
  const userName = rand(userNames);
  rawRecords.push({
    id:           i+1,
    useTime:      randDate(),
    userName,
    durationSec:  randInt(1,180),
    duration:     `${randInt(1,180)}s`,
    modelName:    rand(modelNames),
    modelType:    rand(modelTypes),
    appName:      rand(appNames),
    inputTokens:  inp,
    outputTokens: out,
    deductInputTokens:  ded_inp,
    deductOutputTokens: ded_out,
    actualInputTokens:  actual_inp,
    actualOutputTokens: actual_out,
    billingInpRate: inpRate,
    billingOutRate: outRate,
    credits:      randInt(10,5800),
  });
}
rawRecords.sort((a,b)=>b.useTime.localeCompare(a.useTime));

// Add formatted fields
rawRecords.forEach(r=>{
  r.usage       = `输入 ${r.inputTokens.toLocaleString()} / 输出 ${r.outputTokens.toLocaleString()} Token`;
  r.deduct      = `输入：${r.deductInputTokens.toLocaleString()}Token，输出：${r.deductOutputTokens.toLocaleString()}Token`;
  r.actualUsage = `输入：${r.actualInputTokens.toLocaleString()}Token，输出：${r.actualOutputTokens.toLocaleString()}Token`;
  r.billingRule = `输入：${r.billingInpRate}Token=1积分，输出：${r.billingOutRate}Token=1积分`;
});

/* ============================================
   AGGREGATE: build user-dimension summary
   ============================================ */
function buildUserSummary(groupKey){
  // groupKey: 'modelName' or 'appName'
  const map = {};
  rawRecords.forEach(r=>{
    const key = `${r.userName}|||${r[groupKey]}`;
    if(!map[key]){
      map[key]={
        userName:     r.userName,
        groupValue:   r[groupKey],
        modelType:    r.modelType,
        callCount:    0,
        totalDuration:0,
        totalInput:   0,
        totalOutput:  0,
        totalDeductInp:  0,
        totalDeductOut:  0,
        totalActualInp:  0,
        totalActualOut:  0,
        totalCredits: 0,
        records:      [],
      };
    }
    const g=map[key];
    g.callCount++;
    g.totalDuration   += r.durationSec;
    g.totalInput      += r.inputTokens;
    g.totalOutput     += r.outputTokens;
    g.totalDeductInp  += r.deductInputTokens;
    g.totalDeductOut  += r.deductOutputTokens;
    g.totalActualInp  += r.actualInputTokens;
    g.totalActualOut  += r.actualOutputTokens;
    g.totalCredits    += r.credits;
    g.records.push(r);
  });
  const arr = Object.values(map);
  // Formatted display fields
  arr.forEach(g=>{
    g.duration    = `${g.totalDuration}s`;
    g.usage       = `输入 ${g.totalInput.toLocaleString()} / 输出 ${g.totalOutput.toLocaleString()} Token`;
    g.deduct      = `输入：${g.totalDeductInp.toLocaleString()}Token，输出：${g.totalDeductOut.toLocaleString()}Token`;
    g.actualUsage = `输入：${g.totalActualInp.toLocaleString()}Token，输出：${g.totalActualOut.toLocaleString()}Token`;
    g.billingRule = g.records[0].billingRule;
    g.records.sort((a,b)=>b.useTime.localeCompare(a.useTime));
  });
  arr.sort((a,b)=>b.totalCredits - a.totalCredits);
  return arr;
}

/* ============================================
   COLUMN DEFINITIONS
   ============================================ */
const columnDefs = {
  'time-model': [
    { key:'useTime',     label:'使用时间' },
    { key:'userName',    label:'客户名称' },
    { key:'duration',    label:'耗时' },
    { key:'modelName',   label:'模型名称' },
    { key:'modelType',   label:'模型类型',   tag:true },
    { key:'usage',       label:'使用情况' },
    { key:'deduct',      label:'抵扣情况' },
    { key:'actualUsage', label:'实际使用情况' },
    { key:'billingRule', label:'计费规则' },
    { key:'credits',     label:'积分',       highlight:true },
  ],
  'time-app': [
    { key:'useTime',     label:'使用时间' },
    { key:'userName',    label:'客户名称' },
    { key:'duration',    label:'耗时' },
    { key:'appName',     label:'应用名称' },
    { key:'modelType',   label:'应用类型',   tag:true },
    { key:'usage',       label:'使用情况' },
    { key:'deduct',      label:'抵扣情况' },
    { key:'actualUsage', label:'实际使用情况' },
    { key:'billingRule', label:'计费规则' },
    { key:'credits',     label:'积分',       highlight:true },
  ],
  'user-model': [
    { key:'userName',    label:'客户名称' },
    { key:'callCount',   label:'调用次数' },
    { key:'duration',    label:'总耗时' },
    { key:'groupValue',  label:'模型名称' },
    { key:'modelType',   label:'模型类型',   tag:true },
    { key:'usage',       label:'使用情况（汇总）' },
    { key:'deduct',      label:'抵扣情况（汇总）' },
    { key:'actualUsage', label:'实际使用情况' },
    { key:'billingRule', label:'计费规则' },
    { key:'totalCredits',label:'消耗积分',   highlight:true },
    { key:'_action',     label:'操作' },
  ],
  'user-app': [
    { key:'userName',    label:'客户名称' },
    { key:'callCount',   label:'调用次数' },
    { key:'duration',    label:'总耗时' },
    { key:'groupValue',  label:'应用名称' },
    { key:'modelType',   label:'应用类型',   tag:true },
    { key:'usage',       label:'使用情况（汇总）' },
    { key:'deduct',      label:'抵扣情况（汇总）' },
    { key:'actualUsage', label:'实际使用情况' },
    { key:'billingRule', label:'计费规则' },
    { key:'totalCredits',label:'消耗积分',   highlight:true },
    { key:'_action',     label:'操作' },
  ],
};

/* ============================================
   TAG COLORS
   ============================================ */
function getTagClass(v){
  if(v==='大语言模型') return 'tag-purple';
  if(v==='图像生成模型') return 'tag-green';
  if(v==='语音识别模型') return 'tag-blue';
  if(v==='多模态模型') return 'tag-orange';
  return 'tag-gray';
}

/* ============================================
   GET CURRENT DATA SOURCE
   ============================================ */
let userModelSummary = [];
let userAppSummary   = [];

function getCurrentData(){
  if(currentDim==='user-model'){
    if(!userModelSummary.length) userModelSummary = buildUserSummary('modelName');
    return userModelSummary;
  }
  if(currentDim==='user-app'){
    if(!userAppSummary.length) userAppSummary = buildUserSummary('appName');
    return userAppSummary;
  }
  return rawRecords; // time-model, time-app
}

/* ============================================
   RENDER TABLE
   ============================================ */
function renderTable(){
  const data = getCurrentData();
  const cols = columnDefs[currentDim];
  const total = data.length;
  const totalPages = Math.ceil(total / pageSize);
  const start = (currentPage-1)*pageSize;
  const pageData = data.slice(start, start+pageSize);
  const isUserDim = currentDim.startsWith('user');

  // THEAD
  let headHTML = '<tr>';
  cols.forEach(c=>{ headHTML += `<th>${c.label} <span class="sort-icon">&#8597;</span></th>`; });
  headHTML += '</tr>';
  document.getElementById('tableHead').innerHTML = headHTML;

  // TBODY
  let bodyHTML = '';
  pageData.forEach((row, idx)=>{
    bodyHTML += '<tr>';
    cols.forEach(c=>{
      if(c.key==='_action'){
        bodyHTML += `<td><button class="btn-detail" onclick="openDrawer(${start+idx})">详情</button></td>`;
      } else if(c.highlight){
        const val = row[c.key];
        bodyHTML += `<td><span class="cell-mono cell-highlight">${typeof val==='number'?val.toLocaleString():val}</span></td>`;
      } else if(c.tag){
        bodyHTML += `<td><span class="tag ${getTagClass(row[c.key])}">${row[c.key]}</span></td>`;
      } else if(c.key==='callCount'){
        bodyHTML += `<td><span class="cell-mono" style="color:var(--accent-blue);font-weight:700;">${row[c.key]} 次</span></td>`;
      } else {
        bodyHTML += `<td>${row[c.key]}</td>`;
      }
    });
    bodyHTML += '</tr>';
  });
  document.getElementById('tableBody').innerHTML = bodyHTML;

  // Record count
  document.getElementById('recordCount').textContent = `共 ${total} 条`;

  // Pagination info
  const endIdx = Math.min(start+pageSize, total);
  document.getElementById('paginationInfo').innerHTML =
    `显示第 <strong>${total?start+1:0}</strong> - <strong>${endIdx}</strong> 条，共 <strong>${total}</strong> 条记录`;

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  let html = '';
  html += `<button class="page-btn ${currentPage===1?'disabled':''}" onclick="goPage(${currentPage-1})">&laquo;</button>`;
  const maxV=7;
  let sP=Math.max(1,currentPage-3), eP=Math.min(totalPages,sP+maxV-1);
  if(eP-sP<maxV-1) sP=Math.max(1,eP-maxV+1);
  if(sP>1){ html+=`<button class="page-btn" onclick="goPage(1)">1</button>`; if(sP>2) html+=`<button class="page-btn disabled">...</button>`; }
  for(let i=sP;i<=eP;i++) html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if(eP<totalPages){ if(eP<totalPages-1) html+=`<button class="page-btn disabled">...</button>`; html+=`<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`; }
  html += `<button class="page-btn ${currentPage===totalPages||!totalPages?'disabled':''}" onclick="goPage(${currentPage+1})">&raquo;</button>`;
  document.getElementById('pagination').innerHTML = html;
}

function goPage(p){
  const data=getCurrentData();
  const tp=Math.ceil(data.length/pageSize);
  if(p<1||p>tp) return;
  currentPage=p;
  renderTable();
  document.querySelector('.table-section').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ============================================
   DIMENSION SWITCH (two-group selector)
   ============================================ */
function setAxis(el){
  document.querySelectorAll('#dimGroupAxis .dim-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  dimAxis = el.dataset.val;
  applyDimension();
}
function setContent(el){
  document.querySelectorAll('#dimGroupContent .dim-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  dimContent = el.dataset.val;
  applyDimension();
}
function applyDimension(){
  currentDim = `${dimAxis}-${dimContent}`;
  currentPage = 1;
  const labels = {
    'time-model':'时间 + 模型 收益明细列表',
    'time-app':  '时间 + 应用 收益明细列表',
    'user-model':'客户 + 模型 收益列表',
    'user-app':  '客户 + 应用 收益列表',
  };
  document.getElementById('tableTitle').textContent = labels[currentDim];
  renderTable();
}

/* ============================================
   FILTER ACTIONS
   ============================================ */
function handleQuery(){
  const btn=event.target.closest('.btn')||event.target.closest('.btn-icon');
  if(btn){btn.style.transform='scale(0.96)';setTimeout(()=>{btn.style.transform='';},150);}
  currentPage=1;
  renderTable();
}
function handleReset(){
  document.querySelectorAll('.filter-item input[type="text"]').forEach(el=>el.value='');
  document.querySelectorAll('.filter-item select').forEach(el=>el.selectedIndex=0);
  currentPage=1;
  renderTable();
}

/* ============================================
   DRAWER — open
   ============================================ */
function openDrawer(idx){
  const data = getCurrentData();
  const row  = data[idx];
  if(!row) return;

  const isUserDim = currentDim.startsWith('user');
  const isModel   = currentDim.endsWith('model');

  if(isUserDim){
    // ---- USER DIMENSION: summary card + call record list ----
    document.getElementById('drawerTitle').textContent = '客户收益详情';
    document.getElementById('drawerBadge').textContent = row.userName;

    let html = '';

    // === Summary Card ===
    html += `<div class="drawer-summary">
      <div class="summary-row" style="grid-template-columns:repeat(3,1fr);">
        <div class="summary-item">
          <div class="s-label">客户名称</div>
          <div class="s-value">${row.userName}</div>
        </div>
        <div class="summary-item">
          <div class="s-label">${isModel?'模型名称':'应用名称'}</div>
          <div class="s-value" style="font-size:15px;">${row.groupValue}</div>
        </div>
        <div class="summary-item">
          <div class="s-label">${isModel?'模型类型':'应用类型'}</div>
          <div class="s-value"><span class="tag ${getTagClass(row.modelType)}">${row.modelType}</span></div>
        </div>
      </div>
      <div class="summary-row" style="margin-top:16px;">
        <div class="summary-item">
          <div class="s-label">调用次数</div>
          <div class="s-value" style="color:#0984E3;">${row.callCount}<span class="s-unit"> 次</span></div>
        </div>
        <div class="summary-item">
          <div class="s-label">总耗时</div>
          <div class="s-value">${row.totalDuration}<span class="s-unit"> s</span></div>
        </div>
        <div class="summary-item">
          <div class="s-label">总消耗积分</div>
          <div class="s-value s-primary">${row.totalCredits.toLocaleString()}<span class="s-unit"> 积分</span></div>
        </div>
        <div class="summary-item">
          <div class="s-label">总抵扣</div>
          <div class="s-value" style="font-size:13px;">输入：${row.totalDeductInp.toLocaleString()}Token<br>输出：${row.totalDeductOut.toLocaleString()}Token</div>
        </div>
      </div>
    </div>`;

    // === Call Record List ===
    const records = row.records;
    html += `<div class="drawer-table-wrap">
      <div class="drawer-table-head">
        <div class="dt-title">调用明细记录</div>
        <div class="dt-count">${records.length} 条记录</div>
      </div>
      <div class="drawer-table-scroll">
        <table class="drawer-table">
          <thead>
            <tr>
              <th>#</th>
              <th>使用时间</th>
              <th>耗时</th>
              <th>${isModel?'模型名称':'应用名称'}</th>
              <th>${isModel?'模型类型':'应用类型'}</th>
              <th>使用情况</th>
              <th>抵扣情况</th>
              <th>实际使用情况</th>
              <th>计费规则</th>
              <th>积分</th>
            </tr>
          </thead>
          <tbody>`;

    records.forEach((rec,i)=>{
      html += `<tr>
        <td><span class="row-idx">${i+1}</span></td>
        <td>${rec.useTime}</td>
        <td>${rec.duration}</td>
        <td>${isModel?rec.modelName:rec.appName}</td>
        <td><span class="tag ${getTagClass(rec.modelType)}" style="font-size:10.5px;padding:2px 8px;">${rec.modelType}</span></td>
        <td>${rec.usage}</td>
        <td>${rec.deduct}</td>
        <td>${rec.actualUsage}</td>
        <td style="font-size:11.5px;color:var(--text-secondary);">${rec.billingRule}</td>
        <td><span class="cell-mono cell-highlight">${rec.credits.toLocaleString()}</span></td>
      </tr>`;
    });

    html += `</tbody></table></div></div>`;

    document.getElementById('drawerBody').innerHTML = html;

  } else {
    // ---- TIME DIMENSION: single record detail (unchanged logic) ----
    document.getElementById('drawerTitle').textContent = '调用详情';
    document.getElementById('drawerBadge').textContent = isModel ? row.modelName : row.appName;

    let html = `<div style="padding:28px;">`;

    html += `<div class="detail-section">
      <div class="detail-section-title">基础信息</div>
      <div class="detail-grid">
        <div class="detail-cell"><div class="cell-label">使用时间</div><div class="cell-value">${row.useTime}</div></div>
        <div class="detail-cell"><div class="cell-label">耗时</div><div class="cell-value">${row.duration}</div></div>
        <div class="detail-cell full"><div class="cell-label">客户名称</div><div class="cell-value">${row.userName}</div></div>
      </div>
    </div>`;

    html += `<div class="detail-section">
      <div class="detail-section-title">${isModel?'模型信息':'应用信息'}</div>
      <div class="detail-grid">
        <div class="detail-cell"><div class="cell-label">${isModel?'模型名称':'应用名称'}</div><div class="cell-value">${isModel?row.modelName:row.appName}</div></div>
        <div class="detail-cell"><div class="cell-label">${isModel?'模型类型':'应用类型'}</div><div class="cell-value"><span class="tag ${getTagClass(row.modelType)}">${row.modelType}</span></div></div>
      </div>
    </div>`;

    html += `<div class="detail-section">
      <div class="detail-section-title">使用与计费</div>
      <div class="detail-grid">
        <div class="detail-cell full"><div class="cell-label">使用情况</div><div class="cell-value">${row.usage}</div></div>
        <div class="detail-cell"><div class="cell-label">抵扣情况</div><div class="cell-value">${row.deduct}</div></div>
        <div class="detail-cell"><div class="cell-label">实际使用情况</div><div class="cell-value">${row.actualUsage}</div></div>
        <div class="detail-cell full"><div class="cell-label">计费规则</div><div class="cell-value">${row.billingRule}</div></div>
        <div class="detail-cell"><div class="cell-label">消耗积分</div><div class="cell-value highlight">${row.credits.toLocaleString()}</div></div>
      </div>
    </div>`;

    html += `</div>`;
    document.getElementById('drawerBody').innerHTML = html;
  }

  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawerPanel').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawerPanel').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeDrawer(); }
});

/* ============================================
   INIT
   ============================================ */
document.getElementById('tableTitle').textContent = '客户 + 模型 收益列表';
renderTable();
</script>
</body>
</html>
